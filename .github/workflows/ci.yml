name: Synesis CI

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy this validated develop commit to production'
        required: true
        type: boolean
        default: false
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: synesis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carbon-compliance:
    name: Carbon compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Run Carbon compliance gate
        run: npm run test:carbon-compliance

  build:
    needs: carbon-compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test importer lead discovery
        run: npm run test:leads-finder
      - name: Test AI provider model actions
        run: npm run test:provider-model-actions
      - name: Typecheck and build
        run: npm run build
      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: synesis-dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [build, carbon-compliance]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vuyyaqsmlzixhdjvaidj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: synesis-dist
          path: dist/
      - name: Deploy existing Synesis Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Skip deployment when Cloudflare secrets are absent
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository or environment secrets to deploy the existing Synesis Worker.'
      - name: Setup Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Synesis API Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy synesis-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Skip Supabase deployment when access token is absent
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo 'Supabase Edge Function deployment skipped. Add SUPABASE_ACCESS_TOKEN repository or environment secret to enable deployment.'
