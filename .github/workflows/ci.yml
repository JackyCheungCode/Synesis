name: Synesis CI

on:
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy this validated develop commit to production'
        required: true
        type: boolean
        default: false
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: synesis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carbon-compliance:
    name: Carbon compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Run Carbon compliance gate
        run: npm run test:carbon-compliance

  build:
    needs: carbon-compliance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bootstrap and commit npm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('package-lock.json') != ''
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add reproducible npm lockfile"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
      - name: Export generated npm lockfile for Foundation bootstrap
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: synesis-package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
      - name: Test importer lead discovery
        run: npm run test:leads-finder
      - name: Test AI provider model actions
        run: npm run test:provider-model-actions
      - name: Typecheck and build
        run: npm run build
      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: synesis-dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [build, carbon-compliance]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vuyyaqsmlzixhdjvaidj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: synesis-dist
          path: dist/
      - name: Deploy existing Synesis Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
      - name: Skip deployment when Cloudflare secrets are absent
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo 'Deployment skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository or environment secrets to deploy the existing Synesis Worker.'
      - name: Setup Supabase CLI
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Synesis API Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy synesis-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Skip Supabase deployment when access token is absent
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo 'Supabase Edge Function deployment skipped. Add SUPABASE_ACCESS_TOKEN repository or environment secret to enable deployment.'
