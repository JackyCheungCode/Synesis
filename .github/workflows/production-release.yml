name: Synesis Production Release

on:
  workflow_dispatch:
    inputs:
      develop_sha:
        description: "Exact validated commit SHA from develop to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synesis-production-release
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy exact develop commit
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: vuyyaqsmlzixhdjvaidj
    steps:
      - name: Checkout develop history for provenance validation
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate requested SHA belongs to develop
        env:
          TARGET_SHA: ${{ inputs.develop_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "develop_sha must be a full 40-character commit SHA."
            exit 1
          fi
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/develop
          echo "Validated release commit: $TARGET_SHA"

      - name: Checkout exact release commit
        env:
          TARGET_SHA: ${{ inputs.develop_sha }}
        run: git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Carbon compliance
        run: npm run test:carbon-compliance

      - name: Test importer lead discovery
        run: npm run test:leads-finder

      - name: Test AI provider model actions
        run: npm run test:provider-model-actions

      - name: Typecheck and production build
        run: npm run build

      - name: Require Cloudflare production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing production secret: CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing production secret: CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Deploy Synesis Worker
        run: npx wrangler deploy

      - name: Deploy Supabase API Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publish Supabase API Edge Function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy synesis-api --project-ref "$SUPABASE_PROJECT_ID"

      - name: Record release identity
        env:
          TARGET_SHA: ${{ inputs.develop_sha }}
        run: echo "Production release completed from develop commit $TARGET_SHA"
